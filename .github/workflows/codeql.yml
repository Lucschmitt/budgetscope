# Analyse de sécurité du code (CodeQL) : gratuite sur un dépôt public.
name: CodeQL

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "17 5 * * 1"

permissions:
  contents: read

jobs:
  analyse:
    name: CodeQL (${{ matrix.langage }})
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        langage: [javascript-typescript]
    steps:
      - uses: actions/checkout@v7
      - uses: github/codeql-action/init@v3
        with:
          languages: ${{ matrix.langage }}
      - uses: github/codeql-action/analyze@v3
